name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APKs per ABI
        run: flutter build apk --release --split-per-abi

      - name: Copy APKs to workspace
        run: |
          SRC=$(find /home/runner/work -name 'app-*-release.apk' -path '*/flutter-apk/*' -type f 2>/dev/null)
          if [ -z "$SRC" ]; then
            echo "NO APK FOUND"
            exit 1
          fi
          echo "$SRC"
          cp $SRC "$GITHUB_WORKSPACE/"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: cloudbridge-phone-release-apks
          path: app-*-release.apk
